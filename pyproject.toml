[project]
name = "continuity"
version = "0.1.0"
description = "Autonomous integration reliability platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

dependencies = [
    "strands-agents[gemini]>=1.55",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "authlib>=1.4",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    # RS256 App JWTs; the crypto extra pulls `cryptography`.
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

# ---------------------------------------------------------------------------
# Test configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Fixture repositories contain their own test files on purpose — the indexer
# must detect them. They are input data, not this project's tests, and
# collecting them would run a sample repo's suite as if it were ours.
norecursedirs = ["tests/fixtures"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --ignore=tests/fixtures"
markers = [
    "requires_gemini: needs a live Google Gemini API key (primary model)",
    "requires_bedrock: needs live Amazon Bedrock access (optional future provider)",
    "requires_github_app: needs a configured GitHub App",
    "requires_google_oauth: needs Google OAuth credentials",
    "requires_aws: needs AWS credentials via the standard chain",
]

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "tests"]
# Fixture repositories are *input* to the indexer, not project source. They
# deliberately contain undefined names and partial code so the analyzers have
# something realistic to parse; linting them would be meaningless.
extend-exclude = ["tests/fixtures/"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit — security lint matters in this project
    "ASYNC",    # async correctness
    "RUF",
]
ignore = [
    "E501",     # line length is handled by the formatter
    "B008",     # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests may assert, use fixtures with hardcoded non-secret values, and bind sockets.
"tests/**" = ["S101", "S105", "S106", "S311"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["backend"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true
